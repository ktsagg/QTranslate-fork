name: Build AI Plugin 1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build ai-services JAR
        run: ./gradlew :plugins:ai-services:jar --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ai-services-plugin
          path: plugins/ai-services/build/libs/*.jar
